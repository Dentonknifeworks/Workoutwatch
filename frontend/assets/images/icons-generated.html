<!DOCTYPE html>
<html>
<head>
  <title>Generated Icons</title>
  <style>
    body {
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
      font-family: sans-serif;
      color: white;
    }
    h1 { color: #00D9FF; }
    .grid {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: end;
    }
    .item {
      text-align: center;
      background: #0a0a0a;
      padding: 20px;
      border-radius: 16px;
    }
    .item img {
      display: block;
      margin: 0 auto;
    }
    .item p {
      margin-top: 10px;
      color: #888;
    }
  </style>
</head>
<body>
  <h1>✅ Generated PNG Icons</h1>
  <div class="grid">
    <div class="item">
      <img src="icon-512.png" width="256" height="256">
      <p>512x512 (Play Store)</p>
    </div>
    <div class="item">
      <img src="icon-192.png" width="192" height="192">
      <p>192x192</p>
    </div>
    <div class="item">
      <img src="icon-96.png" width="96" height="96">
      <p>96x96</p>
    </div>
    <div class="item">
      <img src="icon-48.png" width="48" height="48">
      <p>48x48</p>
    </div>
  </div>
</body>
</html>
