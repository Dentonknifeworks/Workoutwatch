<!DOCTYPE html>
<html>
<head>
  <title>Workout Timer Icon Preview</title>
  <style>
    body {
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      color: white;
    }
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 40px;
      align-items: end;
    }
    .preview-item {
      text-align: center;
    }
    .preview-item p {
      margin-top: 12px;
      color: #888;
      font-size: 14px;
    }
    h1 {
      color: #00D9FF;
      margin-bottom: 40px;
    }
    .icon-512 { width: 512px; height: 512px; }
    .icon-192 { width: 192px; height: 192px; }
    .icon-96 { width: 96px; height: 96px; }
    .icon-48 { width: 48px; height: 48px; }
  </style>
</head>
<body>
  <h1>Workout Timer - Icon Preview</h1>
  
  <div class="preview-grid">
    <div class="preview-item">
      <svg class="icon-512" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="1024" height="1024" rx="224" fill="#0A0A0A"/>
        <circle cx="512" cy="512" r="340" stroke="#00D9FF" stroke-opacity="0.15" stroke-width="60"/>
        <circle cx="512" cy="512" r="340" stroke="#00D9FF" stroke-width="48" stroke-linecap="round" fill="none" stroke-dasharray="1600 2136" transform="rotate(-90 512 512)"/>
        <circle cx="512" cy="512" r="340" stroke="#FF9500" stroke-width="48" stroke-linecap="round" fill="none" stroke-dasharray="400 2136" stroke-dashoffset="-1600" transform="rotate(-90 512 512)"/>
        <circle cx="512" cy="512" r="260" fill="#141414"/>
        <path d="M460 380 L460 644 L680 512 Z" fill="#00D9FF"/>
        <circle cx="512" cy="200" r="16" fill="#00D9FF"/>
        <circle cx="824" cy="512" r="12" fill="#FF9500"/>
      </svg>
      <p>512x512 (Play Store)</p>
    </div>
    
    <div class="preview-item">
      <svg class="icon-192" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="1024" height="1024" rx="224" fill="#0A0A0A"/>
        <circle cx="512" cy="512" r="340" stroke="#00D9FF" stroke-opacity="0.15" stroke-width="60"/>
        <circle cx="512" cy="512" r="340" stroke="#00D9FF" stroke-width="48" stroke-linecap="round" fill="none" stroke-dasharray="1600 2136" transform="rotate(-90 512 512)"/>
        <circle cx="512" cy="512" r="340" stroke="#FF9500" stroke-width="48" stroke-linecap="round" fill="none" stroke-dasharray="400 2136" stroke-dashoffset="-1600" transform="rotate(-90 512 512)"/>
        <circle cx="512" cy="512" r="260" fill="#141414"/>
        <path d="M460 380 L460 644 L680 512 Z" fill="#00D9FF"/>
        <circle cx="512" cy="200" r="16" fill="#00D9FF"/>
        <circle cx="824" cy="512" r="12" fill="#FF9500"/>
      </svg>
      <p>192x192</p>
    </div>
    
    <div class="preview-item">
      <svg class="icon-96" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="1024" height="1024" rx="224" fill="#0A0A0A"/>
        <circle cx="512" cy="512" r="340" stroke="#00D9FF" stroke-opacity="0.15" stroke-width="60"/>
        <circle cx="512" cy="512" r="340" stroke="#00D9FF" stroke-width="48" stroke-linecap="round" fill="none" stroke-dasharray="1600 2136" transform="rotate(-90 512 512)"/>
        <circle cx="512" cy="512" r="340" stroke="#FF9500" stroke-width="48" stroke-linecap="round" fill="none" stroke-dasharray="400 2136" stroke-dashoffset="-1600" transform="rotate(-90 512 512)"/>
        <circle cx="512" cy="512" r="260" fill="#141414"/>
        <path d="M460 380 L460 644 L680 512 Z" fill="#00D9FF"/>
      </svg>
      <p>96x96</p>
    </div>
    
    <div class="preview-item">
      <svg class="icon-48" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="1024" height="1024" rx="224" fill="#0A0A0A"/>
        <circle cx="512" cy="512" r="340" stroke="#00D9FF" stroke-width="60" stroke-linecap="round" fill="none" stroke-dasharray="1600 2136" transform="rotate(-90 512 512)"/>
        <circle cx="512" cy="512" r="260" fill="#141414"/>
        <path d="M460 380 L460 644 L680 512 Z" fill="#00D9FF"/>
      </svg>
      <p>48x48</p>
    </div>
  </div>
  
  <div style="margin-top: 60px; padding: 30px; background: #0a0a0a; border-radius: 16px;">
    <h3 style="color: #00D9FF; margin-top: 0;">Icon Features:</h3>
    <ul style="color: #ccc; line-height: 2;">
      <li><span style="color: #00D9FF;">●</span> Cyan progress ring = Work phase</li>
      <li><span style="color: #FF9500;">●</span> Orange segment = Rest phase</li>
      <li>Play button = Start/Active state</li>
      <li>Dark background matches app theme</li>
    </ul>
  </div>
</body>
</html>
