<svg width="1024" height="500" viewBox="0 0 1024 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A"/>
      <stop offset="100%" style="stop-color:#1A1A1A"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00D9FF;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#00D9FF;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bgGradient)"/>
  
  <!-- Decorative glow line -->
  <rect x="0" y="248" width="1024" height="4" fill="url(#cyanGlow)"/>
  
  <!-- Left side: App Icon -->
  <g transform="translate(80, 100)">
    <!-- Icon background -->
    <rect width="300" height="300" rx="67" fill="#0A0A0A" stroke="#222" stroke-width="2"/>
    
    <!-- Outer glow ring -->
    <circle cx="150" cy="150" r="100" stroke="#00D9FF" stroke-opacity="0.15" stroke-width="18"/>
    
    <!-- Progress ring (work phase) -->
    <circle cx="150" cy="150" r="100" stroke="#00D9FF" stroke-width="14" stroke-linecap="round" fill="none"
      stroke-dasharray="470 628" 
      transform="rotate(-90 150 150)"/>
    
    <!-- Rest phase indicator -->
    <circle cx="150" cy="150" r="100" stroke="#FF9500" stroke-width="14" stroke-linecap="round" fill="none"
      stroke-dasharray="120 628" 
      stroke-dashoffset="-470"
      transform="rotate(-90 150 150)"/>
    
    <!-- Inner circle -->
    <circle cx="150" cy="150" r="76" fill="#141414"/>
    
    <!-- Play button -->
    <path d="M132 110 L132 190 L197 150 Z" fill="#00D9FF"/>
    
    <!-- Top dot -->
    <circle cx="150" cy="58" r="5" fill="#00D9FF"/>
  </g>
  
  <!-- Right side: Text content -->
  <g transform="translate(440, 120)">
    <!-- Main title -->
    <text x="0" y="60" font-family="Arial Black, Arial, sans-serif" font-size="72" font-weight="900" fill="#FFFFFF">
      WORKOUT
    </text>
    <text x="0" y="130" font-family="Arial Black, Arial, sans-serif" font-size="72" font-weight="900" fill="#00D9FF">
      TIMER
    </text>
    
    <!-- Tagline -->
    <text x="0" y="180" font-family="Arial, sans-serif" font-size="24" fill="#888888">
      Voice-Guided Interval Training
    </text>
    
    <!-- Feature tags -->
    <g transform="translate(0, 220)">
      <!-- HIIT tag -->
      <rect x="0" y="0" width="80" height="36" rx="18" fill="#00D9FF" fill-opacity="0.15" stroke="#00D9FF" stroke-width="1"/>
      <text x="40" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#00D9FF" text-anchor="middle">HIIT</text>
      
      <!-- Tabata tag -->
      <rect x="95" y="0" width="100" height="36" rx="18" fill="#FF9500" fill-opacity="0.15" stroke="#FF9500" stroke-width="1"/>
      <text x="145" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FF9500" text-anchor="middle">TABATA</text>
      
      <!-- Strength tag -->
      <rect x="210" y="0" width="115" height="36" rx="18" fill="#4CD964" fill-opacity="0.15" stroke="#4CD964" stroke-width="1"/>
      <text x="267" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4CD964" text-anchor="middle">STRENGTH</text>
      
      <!-- Cardio tag -->
      <rect x="340" y="0" width="100" height="36" rx="18" fill="#FF3B30" fill-opacity="0.15" stroke="#FF3B30" stroke-width="1"/>
      <text x="390" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FF3B30" text-anchor="middle">CARDIO</text>
    </g>
  </g>
  
  <!-- Bottom decorative elements -->
  <circle cx="950" cy="450" r="80" fill="#00D9FF" fill-opacity="0.05"/>
  <circle cx="900" cy="50" r="40" fill="#FF9500" fill-opacity="0.05"/>
  
</svg>
